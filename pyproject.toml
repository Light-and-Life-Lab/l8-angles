[build-system]
requires = ["setuptools>=68", "Cython>=3.0", "numpy>=2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "l8angles"
version = "1.0.0"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=2.0"]

[tool.cibuildwheel]
build = "cp*"
skip = "*-win* *-musllinux* cp315-* cp315t-*"  # Exclude Windows and Alpine/musl Linux (leaving only macOS and manylinux), and skip CPython 3.15 because it is not released yet"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = "pytest"
test-command = "python -c \"import l8angles\""

[tool.cibuildwheel.linux]
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
